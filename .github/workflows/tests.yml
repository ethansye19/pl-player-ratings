name: tests

# The test suite without the data-backed tests: data/ is never committed, so tests marked
# `data` (the 2015/16 rule checks on the processed season) can only run locally.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    name: pytest -m "not data"
    runs-on: windows-latest  # the project, its scheduled-task wrapper and its tests are Windows-first
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # a test reads the pre-decision baseline weights from an earlier commit

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install the pinned requirements
        run: python -m pip install -r requirements.txt

      - name: Run the tests that need no processed data
        run: python -m pytest -q -m "not data" -p no:cacheprovider
